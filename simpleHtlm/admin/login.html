<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | Academic Excellence</title>
  
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body style="background-color: var(--primary-navy);">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div style="text-align: center; margin-bottom: 25px;">
        <img src="../assets/logo-dark.svg" alt="Academic Excellence" style="height: 48px; margin: 0 auto 16px auto;" />
        <h2 style="font-size: 1.6rem; color: #0b1b3d; margin-bottom: 6px;">Staff Administration</h2>
        <p style="font-size: 0.9rem; color: #64748b;">Sign in to access candidate applications, courses CMS &amp; financials.</p>
      </div>

      <div id="loginErrorMsg" style="display: none; background: #fdf2f2; border: 1px solid #f8b4b4; color: #9b1c1c; padding: 12px; font-size: 0.88rem; margin-bottom: 20px;"></div>

      <form id="adminLoginForm" action="javascript:void(0);" onsubmit="event.preventDefault(); return false;">
        <div class="form-group">
          <label class="form-label">Administrator Email</label>
          <input type="email" id="adminEmail" class="form-input" placeholder="solhm1@yahoo.com" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="adminPassword" class="form-input" placeholder="••••••••••••" required autocomplete="current-password" />
        </div>

        <div style="margin-top: 25px;">
          <button type="submit" id="adminSubmitBtn" class="btn btn-orange" style="width: 100%;">Sign In to Dashboard &rarr;</button>
        </div>
      </form>

      <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 0.82rem; color: #64748b; text-align: center;">
        Academic Excellence Admissions &amp; FAYDA Registry Portal &bull; <a href="../index.html" style="color: var(--primary-blue); font-weight: 600;">Return to Website</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-service.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Check if already authenticated and not explicitly in logout mode
      const params = new URLSearchParams(window.location.search);
      if (params.get("logout") !== "1" && window.AdminService.checkAuth()) {
        window.location.replace("index.html?auth=1");
        return;
      }

      const form = document.getElementById("adminLoginForm");
      const errBox = document.getElementById("loginErrorMsg");
      const submitBtn = document.getElementById("adminSubmitBtn");

      async function submitLogin(email, pass) {
        errBox.style.display = "none";
        submitBtn.textContent = "Authenticating with Supabase...";
        submitBtn.disabled = true;

        try {
          const res = await window.AdminService.login(email, pass);
          if (res.success) {
            window.location.replace("index.html?auth=1");
          } else {
            errBox.textContent = res.error;
            errBox.style.display = "block";
            submitBtn.textContent = "Sign In to Dashboard \u2192";
            submitBtn.disabled = false;
          }
        } catch (e) {
          errBox.textContent = "Authentication error: " + (e.message || "Failed to log in");
          errBox.style.display = "block";
          submitBtn.textContent = "Sign In to Dashboard \u2192";
          submitBtn.disabled = false;
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("adminEmail").value;
        const pass = document.getElementById("adminPassword").value;
        submitLogin(email, pass);
      });
    });
  </script>
</body>
</html>
