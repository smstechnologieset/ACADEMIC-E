<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1854a1"/>
      <stop offset="50%" stop-color="#219fda"/>
      <stop offset="100%" stop-color="#0b1b3d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#df6b26"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Orbital Swirl Icon (inspired by BPG globe mark) -->
  <g transform="translate(10, 5)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="url(#orbitGrad)" stroke-width="7" stroke-dasharray="160 30" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="28" fill="none" stroke="#219fda" stroke-width="4" stroke-dasharray="100 40" stroke-linecap="round" opacity="0.85"/>
    <circle cx="40" cy="40" r="20" fill="url(#orbitGrad)" opacity="0.15"/>
    <!-- Central Cap / Star -->
    <path d="M 40 26 L 44 34 L 53 35 L 47 41 L 48 50 L 40 45 L 32 50 L 33 41 L 27 35 L 36 34 Z" fill="url(#accentGrad)"/>
    <!-- Orbiting Arc -->
    <path d="M 12 40 A 28 28 0 0 1 68 40" fill="none" stroke="#df6b26" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="96" y="42" font-family="'Libre Baskerville', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    ACADEMIC<tspan fill="#df6b26">·</tspan>E
  </text>
  <text x="98" y="64" font-family="'Open Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#b0c4de" letter-spacing="3.5" text-transform="uppercase">
    Academic Excellence
  </text>
  <line x1="98" y1="72" x2="280" y2="72" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
